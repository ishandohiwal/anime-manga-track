<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OtakuVault — Ultimate Anime & Manga Tracker</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0b0e14;
            --card-bg: #161b22;
            --border-color: rgba(255, 255, 255, 0.08);
            --text-main: #f0f6fc;
            --text-muted: #8b949e;
            --accent: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        nav {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(11, 14, 20, 0.9);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 40px;
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #f43f5e, #a855f7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 24px;
            list-style: none;
        }

        .nav-links li {
            font-weight: 500;
            font-size: 0.95rem;
            color: var(--text-muted);
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-links li:hover, .nav-links li.active {
            color: var(--text-main);
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            border-radius: 50px;
            padding: 8px 16px;
            gap: 10px;
            width: 260px;
        }

        .search-box:focus-within {
            border-color: var(--accent);
        }

        .search-box input {
            background: transparent;
            border: none;
            outline: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9rem;
            width: 100%;
        }

        .main-container {
            flex: 1;
            padding: 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
            width: 100%;
        }

        .section-title {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 16px;
        }

        .genre-bar {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding-bottom: 15px;
            margin-bottom: 25px;
            scrollbar-width: none;
        }
        .genre-bar::-webkit-scrollbar { display: none; }

        .genre-pill {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--text-muted);
            cursor: pointer;
            white-space: nowrap;
            transition: all 0.2s;
        }

        .genre-pill:hover, .genre-pill.active {
            background: var(--accent);
            color: white;
            border-color: var(--accent);
        }

        .trending-banner {
            position: relative;
            height: 380px;
            border-radius: 24px;
            overflow: hidden;
            margin-bottom: 40px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            background-size: cover;
            background-position: center;
        }

        .trending-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(0deg, #0b0e14 0%, rgba(11,14,20,0.4) 60%, transparent 100%);
        }

        .trending-content {
            position: relative;
            z-index: 2;
            padding: 30px;
            max-width: 700px;
        }

        .trending-badge {
            background: var(--accent);
            color: white;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 6px;
            text-transform: uppercase;
            margin-bottom: 10px;
            display: inline-block;
        }

        .trending-title {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .trending-desc {
            font-size: 0.9rem;
            color: var(--text-muted);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .carousel-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .media-card {
            background: var(--card-bg);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .media-card:hover {
            transform: translateY(-5px);
            border-color: rgba(255, 255, 255, 0.2);
        }

        .media-thumb {
            height: 250px;
            background-size: cover;
            background-position: center;
            position: relative;
            background-color: #21262d;
        }

        .media-rating {
            position: absolute;
            top: 10px;
            right: 10px;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            padding: 4px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 700;
            color: #fbbf24;
        }

        .media-info {
            padding: 14px;
            display: flex;
            flex-direction: column;
            flex: 1;
            justify-content: space-between;
        }

        .media-name {
            font-weight: 600;
            font-size: 0.95rem;
            margin-bottom: 6px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .media-meta {
            font-size: 0.8rem;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(12px);
            z-index: 1000;
            display: none;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 24px;
            max-width: 850px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
        }

        .modal-header {
            display: flex;
            gap: 25px;
        }

        .modal-thumb {
            width: 220px;
            height: 310px;
            border-radius: 16px;
            background-size: cover;
            background-position: center;
            flex-shrink: 0;
        }

        .modal-details h2 {
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .modal-tags {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border-color);
            padding: 4px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            color: var(--text-muted);
        }

        .modal-synopsis {
            font-size: 0.9rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .tracker-controls {
            background: rgba(0,0,0,0.2);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tracker-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        select, button {
            background: var(--accent);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 10px;
            font-family: inherit;
            font-weight: 600;
            cursor: pointer;
            outline: none;
        }

        select {
            background: rgba(0,0,0,0.4);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .progress-stepper {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .step-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border-color);
            width: 32px;
            height: 32px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
        }
        .step-btn:hover { background: var(--accent); }

        .close-modal {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--border-color);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            color: var(--text-main);
        }
        .close-modal:hover { background: var(--accent); }

        .loader {
            text-align: center;
            padding: 60px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="switchTab('home')">OtakuVault 🏮</div>
        <ul class="nav-links">
            <li id="nav-home" class="active" onclick="switchTab('home')">Home</li>
            <li id="nav-anime" onclick="switchTab('anime')">Anime Hub</li>
            <li id="nav-manga" onclick="switchTab('manga')">Manga Hub</li>
            <li id="nav-library" onclick="switchTab('library')">My Library 📚</li>
        </ul>
        <div class="search-box">
            <span>🔍</span>
            <input type="text" id="search-input" placeholder="Search anime/manga..." onkeypress="handleSearch(event)">
        </div>
    </nav>

    <div class="main-container" id="app-container">
        <div class="loader">Waking up catalog servers... ✨</div>
    </div>

    <div class="modal-overlay" id="media-modal" onclick="closeModal(event)">
        <div class="modal-content" id="modal-box"></div>
    </div>

    <script>
        const JIKAN_API = 'https://api.jikan.moe/v4';
        let currentTab = 'home';
        let activeMedia = null;
        let userLibrary = JSON.parse(localStorage.getItem('otaku_library')) || {};
        
        const GENRES = [
            { id: '', name: 'All' },
            { id: 1, name: 'Action' },
            { id: 2, name: 'Adventure' },
            { id: 4, name: 'Comedy' },
            { id: 8, name: 'Drama' },
            { id: 10, name: 'Fantasy' },
            { id: 14, name: 'Horror' },
            { id: 22, name: 'Romance' },
            { id: 24, name: 'Sci-Fi' },
            { id: 36, name: 'Slice of Life' },
            { id: 30, name: 'Sports' }
        ];
        let selectedGenre = '';

        const delay = ms => new Promise(res => setTimeout(res, ms));

        async function init() {
            await loadHomeView();
        }

        async function switchTab(tab) {
            currentTab = tab;
            selectedGenre = '';
            document.querySelectorAll('.nav-links li').forEach(el => el.classList.remove('active'));
            document.getElementById(`nav-${tab}`).classList.add('active');

            const container = document.getElementById('app-container');
            container.innerHTML = `<div class="loader">Loading ${tab} catalog... 🚀</div>`;

            if (tab === 'home') await loadHomeView();
            else if (tab === 'anime') await loadCategoryView('anime');
            else if (tab === 'manga') await loadCategoryView('manga');
            else if (tab === 'library') loadLibraryView();
        }

        async function loadHomeView() {
            const container = document.getElementById('app-container');
            try {
                const resAnime = await fetch(`${JIKAN_API}/top/anime?limit=10`);
                const animeJson = await resAnime.json();
                
                await delay(350);
                const resManga = await fetch(`${JIKAN_API}/top/manga?limit=10`);
                const mangaJson = await resManga.json();

                const animeList = animeJson.data || [];
                const mangaList = mangaJson.data || [];
                const hero = animeList[0] || mangaList[0];

                container.innerHTML = `
                    <div class="trending-banner" style="background-image: url('${hero.images.jpg.large_image_url}')">
                        <div class="trending-overlay"></div>
                        <div class="trending-content">
                            <span class="trending-badge">Live Trending #1</span>
                            <h2 class="trending-title">${hero.title}</h2>
                            <p class="trending-desc">${hero.synopsis || 'No description available.'}</p>
                            <button onclick="openModal(${hero.mal_id}, 'anime')">Explore & Track</button>
                        </div>
                    </div>

                    <div class="section-title">🔥 Trending Anime</div>
                    <div class="carousel-container">
                        ${animeList.map(item => renderCard(item, 'anime')).join('')}
                    </div>

                    <div class="section-title">📖 Popular Manga</div>
                    <div class="carousel-container">
                        ${mangaList.map(item => renderCard(item, 'manga')).join('')}
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<div class="loader">API rate limit encountered. Please wait a moment and refresh the page.</div>`;
            }
        }

        async function loadCategoryView(type) {
            const container = document.getElementById('app-container');
            
            container.innerHTML = `
                <div class="section-title">${type === 'anime' ? 'Anime Hub 🎬' : 'Manga Hub 📖'}</div>
                <div class="genre-bar">
                    ${GENRES.map(g => `
                        <div class="genre-pill ${selectedGenre === g.id ? 'active' : ''}" onclick="filterGenre('${type}', '${g.id}')">${g.name}</div>
                    `).join('')}
                </div>
                <div class="loader">Fetching items...</div>
            `;

            try {
                let url = `${JIKAN_API}/top/${type}?limit=24`;
                if (selectedGenre !== '') {
                    url = `${JIKAN_API}/${type}?genres=${selectedGenre}&limit=24`;
                }

                const res = await fetch(url);
                const json = await res.json();
                let data = json.data || [];

                // Fallback if genre query yields nothing
                if (data.length === 0 && selectedGenre !== '') {
                    const fallbackRes = await fetch(`${JIKAN_API}/top/${type}?limit=24`);
                    const fallbackJson = await fallbackRes.json();
                    data = fallbackJson.data || [];
                }

                container.innerHTML = `
                    <div class="section-title">${type === 'anime' ? 'Anime Hub 🎬' : 'Manga Hub 📖'}</div>
                    <div class="genre-bar">
                        ${GENRES.map(g => `
                            <div class="genre-pill ${selectedGenre === g.id ? 'active' : ''}" onclick="filterGenre('${type}', '${g.id}')">${g.name}</div>
                        `).join('')}
                    </div>
                    <div class="carousel-container">
                        ${data.map(item => renderCard(item, type)).join('')}
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<div class="loader">Failed to load hub data. Try refreshing.</div>`;
            }
        }

        function filterGenre(type, genreId) {
            selectedGenre = genreId;
            loadCategoryView(type);
        }

        function renderCard(item, type) {
            const score = item.score ? item.score : 'N/A';
            const count = type === 'anime' ? `${item.episodes || '?'} Eps` : `${item.chapters || '?'} Chs`;
            return `
                <div class="media-card" onclick="openModal(${item.mal_id}, '${type}')">
                    <div class="media-thumb" style="background-image: url('${item.images.jpg.image_url}')">
                        <div class="media-rating">★ ${score}</div>
                    </div>
                    <div class="media-info">
                        <div class="media-name">${item.title}</div>
                        <div class="media-meta">
                            <span>${item.type || type.toUpperCase()}</span>
                            <span>${count}</span>
                        </div>
                    </div>
                </div>
            `;
        }

        async function handleSearch(e) {
            if (e.key !== 'Enter') return;
            const query = document.getElementById('search-input').value.trim();
            if (!query) return;

            const container = document.getElementById('app-container');
            container.innerHTML = `<div class="loader">Searching for "${query}"... 🔎</div>`;

            try {
                const resAnime = await fetch(`${JIKAN_API}/anime?q=${query}&limit=12`);
                const animeJson = await resAnime.json();
                
                await delay(350);
                const resManga = await fetch(`${JIKAN_API}/manga?q=${query}&limit=12`);
                const mangaJson = await resManga.json();

                const animes = animeJson.data || [];
                const mangas = mangaJson.data || [];

                container.innerHTML = `
                    <div class="section-title">Search Results for "${query}"</div>
                    <div class="carousel-container">
                        ${animes.map(item => renderCard(item, 'anime')).join('')}
                        ${mangas.map(item => renderCard(item, 'manga')).join('')}
                    </div>
                `;
            } catch (err) {
                container.innerHTML = `<div class="loader">Search failed. Please try again.</div>`;
            }
        }

        async function openModal(id, type) {
            const modal = document.getElementById('media-modal');
            const box = document.getElementById('modal-box');
            modal.style.display = 'flex';
            box.innerHTML = `<div class="loader">Loading info...</div>`;

            try {
                const res = await fetch(`${JIKAN_API}/${type}/${id}`);
                const json = await res.json();
                const data = json.data;
                activeMedia = { id, type, data };

                const saved = userLibrary[id] || { status: 'Planning', progress: 0 };
                const maxCount = type === 'anime' ? (data.episodes || 999) : (data.chapters || 999);

                box.innerHTML = `
                    <div class="close-modal" onclick="closeModalDirect()">✕</div>
                    <div class="modal-header">
                        <div class="modal-thumb" style="background-image: url('${data.images.jpg.large_image_url}')"></div>
                        <div class="modal-details">
                            <h2>${data.title}</h2>
                            <div class="modal-tags">
                                <span class="tag">Score: ★ ${data.score || 'N/A'}</span>
                                <span class="tag">${data.status || 'Unknown'}</span>
                                <span class="tag">${data.type || type.toUpperCase()}</span>
                            </div>
                            <p class="modal-synopsis">${data.synopsis || 'No synopsis details provided.'}</p>
                        </div>
                    </div>
                    <div class="tracker-controls">
                        <div class="tracker-row">
                            <strong>Status:</strong>
                            <select id="track-status" onchange="updateTrackerData()">
                                <option value="Planning" ${saved.status === 'Planning' ? 'selected' : ''}>📅 Plan to Watch/Read</option>
                                <option value="Active" ${saved.status === 'Active' ? 'selected' : ''}>🔥 Active</option>
                                <option value="Completed" ${saved.status === 'Completed' ? 'selected' : ''}>✅ Completed</option>
                            </select>
                        </div>
                        <div class="tracker-row">
                            <strong>Progress (${type === 'anime' ? 'Episodes' : 'Chapters'}):</strong>
                            <div class="progress-stepper">
                                <button class="step-btn" onclick="adjustProgress(-1, ${maxCount})">-</button>
                                <span id="progress-val" style="font-weight:700; font-size:1.1rem; width:40px; text-align:center;">${saved.progress}</span>
                                <button class="step-btn" onclick="adjustProgress(1, ${maxCount})">+</button>
                                <span style="color:var(--text-muted)">/ ${type === 'anime' ? (data.episodes || '?') : (data.chapters || '?')}</span>
                            </div>
                        </div>
                    </div>
                `;
            } catch (err) {
                box.innerHTML = `<div class="loader">Could not retrieve information.</div>`;
            }
        }

        function closeModal(e) {
            if (e.target.id === 'media-modal') closeModalDirect();
        }

        function closeModalDirect() {
            document.getElementById('media-modal').style.display = 'none';
            if (currentTab === 'library') loadLibraryView();
        }

        function adjustProgress(amount, max) {
            if (!activeMedia) return;
            const id = activeMedia.id;
            if (!userLibrary[id]) userLibrary[id] = { status: 'Active', progress: 0, data: activeMedia.data, type: activeMedia.type };
            
            let newProg = userLibrary[id].progress + amount;
            if (newProg < 0) newProg = 0;
            if (newProg > max) newProg = max;

            userLibrary[id].progress = newProg;
            document.getElementById('progress-val').textContent = newProg;
            localStorage.setItem('otaku_library', JSON.stringify(userLibrary));
        }

        function updateTrackerData() {
            if (!activeMedia) return;
            const id = activeMedia.id;
            const status = document.getElementById('track-status').value;
            if (!userLibrary[id]) userLibrary[id] = { status, progress: 0, data: activeMedia.data, type: activeMedia.type };
            userLibrary[id].status = status;
            localStorage.setItem('otaku_library', JSON.stringify(userLibrary));
        }

        function loadLibraryView() {
            const container = document.getElementById('app-container');
            const keys = Object.keys(userLibrary);

            if (keys.length === 0) {
                container.innerHTML = `
                    <div class="section-title">My Tracked Library 📚</div>
                    <div class="loader">Your library is empty. Click any item from the hubs to track it!</div>
                `;
                return;
            }

            container.innerHTML = `
                <div class="section-title">My Tracked Library 📚</div>
                <div class="carousel-container">
                    ${keys.map(id => {
                        const item = userLibrary[id];
                        return `
                            <div class="media-card" onclick="openModal(${id}, '${item.type}')">
                                <div class="media-thumb" style="background-image: url('${item.data.images.jpg.image_url}')">
                                    <div class="media-rating">${item.status}</div>
                                </div>
                                <div class="media-info">
                                    <div class="media-name">${item.data.title}</div>
                                    <div class="media-meta">
                                        <span>Progress: ${item.progress}</span>
                                        <span>${item.type.toUpperCase()}</span>
                                    </div>
                                </div>
                            </div>
                        `;
                    }).join('')}
                </div>
            `;
        }

        init();
    </script>
</body>
</html>
